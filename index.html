<style>:root{--bg:#dfeaf7;--sf:#fff;--s2:#f1e7f4;--ln:#e5d9e9;--ink:#211927;--mu:#766b7c;--ac:#743a83;--ok:#16794b;--wn:#9a6700;--er:#b42318;--yl:#f4b400;--ylt:#a87a00;--gl:rgba(255,255,255,.80);--glb:rgba(255,255,255,.92);--sh:0 12px 32px rgba(58,28,66,.11),0 2px 6px rgba(58,28,66,.06)}
body.dark{--bg:#12141c;--sf:#1b1e29;--s2:#232736;--ln:#2f3447;--ink:#e8eaf2;--mu:#9aa3b8;--ac:#b79cf5;--ok:#4cc38a;--wn:#e0b04a;--er:#f08080;--yl:#fbbf24;--ylt:#fbbf24;--gl:rgba(27,30,41,.78);--glb:rgba(255,255,255,.08);--sh:0 12px 32px rgba(0,0,0,.42)}
body.dark{background:radial-gradient(900px 480px at 8% -6%,rgba(124,92,224,.20),transparent 62%),radial-gradient(800px 460px at 100% 2%,rgba(60,110,200,.16),transparent 58%),#12141c;background-attachment:fixed}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.45 system-ui,sans-serif;background:radial-gradient(900px 480px at 8% -6%,rgba(116,58,131,.22),transparent 62%),radial-gradient(800px 460px at 100% 2%,rgba(70,130,215,.30),transparent 58%),linear-gradient(180deg,#e6eefa,#d4e3f5);background-attachment:fixed}
header{background:linear-gradient(115deg,rgba(45,16,56,.94),rgba(81,32,93,.92) 55%,rgba(113,56,126,.90));-webkit-backdrop-filter:saturate(160%) blur(16px);backdrop-filter:saturate(160%) blur(16px);border-bottom:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(40,16,50,.28);color:#fff;padding:12px 20px;position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
body.dark header{background:linear-gradient(115deg,rgba(22,20,42,.92),rgba(42,33,69,.90))}
header img{height:50px;width:50px;object-fit:contain;background:#cfdff2;border-radius:14px;padding:3px;box-shadow:0 4px 14px rgba(0,0,0,.28)}
header b{font-size:16px}
header small{display:block;opacity:.8;font-size:11px;letter-spacing:.5px}
header select{background:rgba(255,255,255,.15);color:#fff;border-color:transparent}
header option{color:#000}



main{max-width:1150px;margin:auto;padding:16px}
.ban{background:var(--ac);color:#fff;padding:8px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
body.dark .ban{color:#12141c}
.card{background:var(--gl);-webkit-backdrop-filter:blur(14px) saturate(150%);backdrop-filter:blur(14px) saturate(150%);border:1px solid var(--glb);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
h2,h3{margin:0 0 8px}
.mu{color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button,input,select,textarea{font:inherit}
input,select,textarea{padding:9px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--s2);color:var(--ink);max-width:100%;transition:box-shadow .15s}
textarea{width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac)}
.b{background:linear-gradient(135deg,#8b47a2,#51205d);color:#fff;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;display:inline-block;box-shadow:0 4px 12px rgba(81,32,93,.26);transition:transform .12s,box-shadow .12s,filter .12s}
.b:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(81,32,93,.30);filter:brightness(1.06)}.b:active{transform:none}
body.dark .b{background:linear-gradient(135deg,#7c5ce0,#5a3fb8)}
.b.s{background:rgba(116,58,131,.08);color:var(--ink);border:1px solid rgba(116,58,131,.20);box-shadow:none}.b.s:hover{background:rgba(116,58,131,.15);box-shadow:none}body.dark .b.s{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.b.r{background:var(--er);color:#fff}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--s2);color:var(--ac);font-size:12px;text-align:left}
td,th{padding:7px;border-bottom:1px solid var(--ln)}
table:not(.hz):not(.sus) tbody tr:nth-child(even) td{background:rgba(116,58,131,.04)}
tr.off td{opacity:.5}
.gs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.gc{border:1px solid var(--glb);border-left:7px solid var(--ga);background:linear-gradient(135deg,color-mix(in srgb,var(--ga) 24%,var(--sf)),color-mix(in srgb,var(--ga) 9%,var(--sf)));color:var(--ink);padding:9px 15px;border-radius:14px;cursor:pointer;box-shadow:0 3px 10px rgba(58,28,66,.07);transition:transform .12s,box-shadow .12s}
.gc:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(58,28,66,.13)}
.gc.on{outline:2px solid var(--ga);box-shadow:0 8px 20px rgba(58,28,66,.17)}
.pill{padding:3px 11px;border-radius:99px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--ac) 12%,transparent)}
.pill.ok{color:var(--ok)}
.pill.er{color:var(--er)}

.pill.per{color:#7c3aed}
.inc-c.closed{border-left:6px solid var(--ok)}
.inc-c.open{border-left:6px solid var(--er)}
#modal{position:fixed;inset:0;background:rgba(30,12,38,.48);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;justify-content:center;align-items:flex-start;overflow:auto;padding:16px;z-index:30}
#modal>div{background:color-mix(in srgb,var(--sf) 94%,transparent);color:var(--ink);border:1px solid var(--glb);border-radius:22px;padding:20px;width:min(680px,100%);box-shadow:0 24px 60px rgba(30,12,38,.35)}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:40}
#toast.e{background:var(--er)}
.auth{max-width:400px;margin:8vh auto}
.auth input{width:100%;margin-bottom:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
#imp{display:none}
@media print{@page{size:A4;margin:14mm}body.p{background:#fff}body.p>*:not(#imp){display:none!important}body.p #imp{display:block}}
#imp{color:#211927;font-size:10pt}
.lh{display:flex;gap:14px;align-items:center;border-bottom:1px solid #d9c8df;padding-bottom:10px}
.lh img{height:52px}
.lh small{letter-spacing:1.2px;color:#743a83;font-weight:700;font-size:8pt}
.lh h1{margin:2px 0 0;font-size:15pt}
.bar{height:4px;background:linear-gradient(90deg,#51205d,#743a83 60%,#c9a3d4);margin:6px 0 14px}
#imp table{font-size:9pt}
#imp th{background:#f1e7f4;color:#51205d}
#imp td,#imp th{border-bottom:1px solid #e7dce9}
#imp tr{break-inside:avoid}

function groupPalette(group){
  const raw=String(group||'').trim();
  const g=raw.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');
  if(/4ESO/.test(g)||/OPTATIVA/.test(g)) return {bg:'hsl(210 62% 93%)',tint:'hsl(210 72% 97%)',accent:'hsl(210 58% 43%)'};
  const m=g.match(/^(\d+)/),level=m?Number(m[1]):0;
  const suffix=raw.toUpperCase().match(/^\d+\s*º?\s*([A-F])(?![A-Z])/)||g.match(/([A-Z])$/),letter=suffix?suffix[1]:'A';
  const idx=Math.max(0,Math.min(5,letter.charCodeAt(0)-65));
  const dir=/BIL/.test(g)?-1:/ORD/.test(g)?1:0,jx=Math.max(0,Math.min(5,idx+dir)); // bil: más suave, hacia la letra anterior · ord: hacia la siguiente
  let hue,light,sat=66,accentLight;
  if(level===2){
    // 2.º ESO: amarillo A -> naranja -> rojo intenso F.
    const hues=[50,34,18,2,346,330], lights=[92,88,92,88,92,88], accents=[44,41,44,40,43,38];
    hue=(hues[idx]+hues[jx])/2;light=(lights[idx]+lights[jx])/2+(dir<0?2:0);accentLight=(accents[idx]+accents[jx])/2;
  }else if(level===3){
    // 3.º ESO: transición continua de verde claro A a verde intenso E/F.
    const hues=[158,128,98,172,142,112], lights=[94,89,94,89,94,89], accents=[42,38,42,37,41,36];
    hue=(hues[idx]+hues[jx])/2;light=(lights[idx]+lights[jx])/2+(dir<0?2:0);accentLight=(accents[idx]+accents[jx])/2;
  }else{
    // Otros niveles: familia azul-verde diferenciada de 2.º y 3.º.
    const hues=[218,196,174,236,208,186], lights=[92,88,92,88,92,88], accents=[43,40,43,39,42,38];
    hue=(hues[idx]+hues[jx])/2;light=(lights[idx]+lights[jx])/2+(dir<0?2:0);accentLight=(accents[idx]+accents[jx])/2;
  }
  return {bg:`hsl(${hue} ${sat}% ${light}%)`,tint:`hsl(${hue} 72% 97%)`,accent:`hsl(${hue} 56% ${accentLight}%)`};
}

async function auth(m){
 const e=$('#ae')?.value.trim(),p=$('#ap')?.value;
 const msg=(t,error=false)=>{const el=$('#am');if(el){el.textContent=t;el.className='auth-message '+(error?'error':'ok')}};

 if(btn){btn.disabled=true;btn.textContent='Un momento…'}
 try{
  if(m==='in'){
   if(!p)return msg('Introduce tu contraseña.',true);
   const {error}=await sb.auth.signInWithPassword({email:e,password:p});
   if(error){msg(error.message==='Invalid login credentials'?'El correo o la contraseña no son correctos.':error.message,true);return}
   await cargar();return;
  }
  if(m==='up'){
   if(!p||p.length<6){msg('La contraseña debe tener al menos 6 caracteres.',true);return}
   const {data,error}=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});
   if(error){msg(error.message,true);return}
   msg(data?.session?'Cuenta creada. Entrando…':'Te hemos enviado un correo de confirmación. Confírmalo y vuelve a esta página.');
   return;
  }
  const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
  msg(error?error.message:'Si la cuenta existe, recibirás un enlace para restablecer la contraseña.',!!error);
 }catch(err){msg(err?.message||'No se ha podido conectar con Supabase. Comprueba la conexión y la configuración del proyecto.',true)}
 finally{if(btn&&document.body.contains(btn)){btn.disabled=false;btn.textContent=m==='in'?'Entrar en GIM':m==='up'?'Crear cuenta':'Enviar enlace de recuperación'}}
}
