function groupPalette(group){
  const raw=String(group||'').trim();
  const g=raw.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'');
  if(/4ESO/.test(g)||/OPTATIVA/.test(g)) return {bg:'hsl(210 62% 93%)',tint:'hsl(210 72% 97%)',accent:'hsl(210 58% 43%)'};
  const m=g.match(/^(\d+)/),level=m?Number(m[1]):0;
  const suffix=raw.toUpperCase().match(/^\d+\s*º?\s*([A-F])(?![A-Z])/)||g.match(/([A-Z])$/),letter=suffix?suffix[1]:'A';
  const idx=Math.max(0,Math.min(5,letter.charCodeAt(0)-65));
  const dir=/BIL/.test(g)?-1:/ORD/.test(g)?1:0,jx=Math.max(0,Math.min(5,idx+dir)); // bil: más suave, hacia la letra anterior · ord: hacia la siguiente
  let hue,light,sat=66,accentLight;
  if(level===2){
    // 2.º ESO: amarillo A -> naranja -> rojo intenso F.
    const hues=[48,37,27,16,5,352], lights=[91,90,90,89,88,86], accents=[43,42,42,41,40,37];
    hue=(hues[idx]+hues[jx])/2;light=(lights[idx]+lights[jx])/2+(dir<0?2:0);accentLight=(accents[idx]+accents[jx])/2;
  }else if(level===3){
    // 3.º ESO: transición continua de verde claro A a verde intenso E/F.
    const hues=[145,137,129,121,113,105], lights=[94,92,90,88,86,84], accents=[42,40,38,36,34,31];
    hue=(hues[idx]+hues[jx])/2;light=(lights[idx]+lights[jx])/2+(dir<0?2:0);accentLight=(accents[idx]+accents[jx])/2;
  }else{
    // Otros niveles: familia azul-verde diferenciada de 2.º y 3.º.
    const hues=[218,210,202,194,186,178], lights=[92,91,90,89,88,86], accents=[43,42,41,40,39,37];
    hue=(hues[idx]+hues[jx])/2;light=(lights[idx]+lights[jx])/2+(dir<0?2:0);accentLight=(accents[idx]+accents[jx])/2;
  }
  return {bg:`hsl(${hue} ${sat}% ${light}%)`,tint:`hsl(${hue} 72% 97%)`,accent:`hsl(${hue} 56% ${accentLight}%)`};
}

const isExcluded=(c,date)=>c.calendar.some(x=>x.type!=='excepcion'&&x.start&&x.end&&x.start<=date&&date<=x.end);
function trace(i){
 let c=LC(),det=(i.detectedAt||'').split('T'),date=det[0],clock=det[1]||'',validClock=/^(?:[01]\d|2[0-3]):[0-5]\d/.test(clock),timeMin=validClock?Number(clock.slice(0,2))*60+Number(clock.slice(3,5)):NaN;
 let start=i.knownGood||c.knownGood[i.code]||c.inspection||'',itype=null,periodAt=-1;
 if(validClock){for(let k=0;k<PERIODS.length;k++){let [sh,sm]=PERIODS[k][1].split(':').map(Number),[eh,em]=PERIODS[k][2].split(':').map(Number);if(timeMin>=sh*60+sm&&timeMin<eh*60+em){periodAt=k;break}}}
 let rows=[{date,time:clock||'Hora no indicada',group:i.group||'No consta',teacher:i.teacher||'No consta',student:i.studentReporter||'No indicado',source:'Detección registrada',priority:'ALUMNO/A QUE NOTIFICA'}];
 if(periodAt<0)return {message:'Sesión no determinada: la hora no coincide con una franja lectiva. Revisa fecha y hora si procede.',rows};
 let cursor=new Date(date+'T12:00:00'),period=periodAt,foundEquivalent=false,maxDays=400,sessionRank=0,stop=false;
 for(let steps=0;steps<maxDays*7&&!stop&&sessionRank<12;steps++){
  period--;if(period<0){cursor.setDate(cursor.getDate()-1);period=5}
  let iso=[cursor.getFullYear(),String(cursor.getMonth()+1).padStart(2,'0'),String(cursor.getDate()).padStart(2,'0')].join('-'),dow=(cursor.getDay()+6)%7;
  if(dow>4||isExcluded(c,iso))continue;if(start&&iso<start)break;
  let slot=c.schedule[dow+'-'+period];if(!slot?.group)continue;
  let daysBack=Math.round((new Date(date+'T12:00:00')-new Date(iso+'T12:00:00'))/86400000),equivalent=daysBack>=7&&slot.group===i.group&&period===periodAt;
  if(equivalent)foundEquivalent=true;
  let users=c.students.filter(st=>st.active!==false&&st.group===slot.group&&Object.values(st.assignments||{}).includes(i.code)).sort((a,b)=>a.number-b.number);
  if(users.length){sessionRank++;let priority,level,detail;
   const R=[['SOSPECHOSO PRINCIPAL','trace-1'],['SOSPECHOSO · MUY ALTO','trace-2'],['SOSPECHOSO · ALTO','trace-3'],['SOSPECHOSO · MEDIO','trace-4'],['SOSPECHOSO · POSIBLE','trace-5']][sessionRank-1]||['MÁS LEJANO','trace-6'];priority=R[0];level=R[1];detail='';
   for(let st of users)rows.push({date:iso,time:PERIODS[period][1]+'–'+PERIODS[period][2],group:slot.group,teacher:slot.teacher||'No asignado',student:st.name,number:st.number,source:'Uso previsto según horario y asignación',priority,level,detail,sessionRank});
  }
  if(equivalent)stop=true;
 }

}

 ${m==='rs'?'':`<div class="tabs"><button class="b ${m==='in'?'':'s'}" onclick="authView('in')">Iniciar sesión</button><button class="b ${m==='up'?'':'s'}" onclick="authView('up')">Crear cuenta</button></div>`}
 <form id="authForm" onsubmit="event.preventDefault();auth('${m}')">
 <label for="ae">Correo electrónico</label><input id="ae" type="email" autocomplete="email" placeholder="profesor@murciaeduca.es" required>

 </form>
 ${m==='in'?'<p style="margin:14px 0 0"><a href="#" onclick="authView(&#39;rs&#39;);return false">He olvidado mi contraseña</a></p>':''}
 <p id="am" class="auth-message ${message?(isError?'error':'ok'):''}" role="status">${esc(message)}</p>
 <p class="auth-note">Usa la misma cuenta de Supabase que en Audiciones Musicales. No necesitas crear otra cuenta si ya tienes acceso a esa aplicación.</p>
 </div><div class="auth-footer">IES Infanta Elena · Departamento de Música · Región de Murcia</div></section></div>`;
}
async function auth(m){
 const e=$('#ae')?.value.trim(),p=$('#ap')?.value;
 const msg=(t,error=false)=>{const el=$('#am');if(el){el.textContent=t;el.className='auth-message '+(error?'error':'ok')}};
 const btn=$('#authSubmit'); if(!e)return msg('Introduce tu correo electrónico.',true);
 if(btn){btn.disabled=true;btn.textContent='Un momento…'}
 try{
  if(m==='in'){
   if(!p)return msg('Introduce tu contraseña.',true);
   const {error}=await sb.auth.signInWithPassword({email:e,password:p});
   if(error){msg(error.message==='Invalid login credentials'?'El correo o la contraseña no son correctos.':error.message,true);return}
   await cargar();return;
  }
  if(m==='up'){
   if(!p||p.length<6){msg('La contraseña debe tener al menos 6 caracteres.',true);return}
   const {data,error}=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:location.origin+location.pathname}});
   if(error){msg(error.message,true);return}
   msg(data?.session?'Cuenta creada. Entrando…':'Te hemos enviado un correo de confirmación. Confírmalo y vuelve a esta página.');
   return;
  }
  const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});
  msg(error?error.message:'Si la cuenta existe, recibirás un enlace para restablecer la contraseña.',!!error);
 }catch(err){msg(err?.message||'No se ha podido conectar con Supabase. Comprueba la conexión y la configuración del proyecto.',true)}
 finally{if(btn&&document.body.contains(btn)){btn.disabled=false;btn.textContent=m==='in'?'Entrar en GIM':m==='up'?'Crear cuenta':'Enviar enlace de recuperación'}}
}
function render(){const d=S.D;$('#app').innerHTML=`<header><img src="${LOGO}"><div><b>GIM · Instrumentos Musicales</b><small>IES INFANTA ELENA · DEPARTAMENTO DE MÚSICA</small><i class="by">by Manuel Esteve</i></div>${T?`<span class="pill">${esc(d?.curso.nombre)}</span>`:`<select onchange="S.cid=this.value;S.g=null;cargar()">${opt(S.cursos.map(c=>[c.id,c.nombre]),S.cid)}</select>`}<nav>${d?nTabs().map(([k,n])=>`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';S.ed=false;S.fade=1;render()">${n}</button>`).join(''):''}${d?'<button onclick="buscar()" title="Buscar (Cmd/Ctrl+K)">🔍</button>':''}<button class="thbtn" onclick="theme()" title="Cambiar tema">${document.body.classList.contains('dark')?'☀':'🌙'}</button><button onclick="salir()">Salir</button></nav></header>${T?`<div class="ban">Modo profesor/a · ${esc(d?.profesor)}</div>`:''}
 <main class="${S.fade?'fade':''}">${d?V[S.tab]():`<div class="card"><h2>Bienvenido/a</h2><p class="mu">Crea tu primer curso (con los grupos e instrumentos habituales) o importa la copia de la app anterior.</p><div class="row"><button class="b" onclick="nuevoCurso()">+ Crear curso</button><label class="b s">Importar copia (.json)<input type="file" accept=".json" hidden onchange="importar(this.files[0])"></label></div></div>`}</main>`;S.fade=0}
// --- cursos, grupos e instrumentos ---

async function addGrupos(ns,hab){const ex=new Set(D().grupos.map(g=>g.nombre)),rows=ns.filter(n=>!ex.has(n)&&!(hab&&D().grupos.some(g=>g.nombre.startsWith(n+' ')))).map(n=>({curso_id:D().curso.id,nombre:n}));if(rows.length)await q(sb.from('gim2_grupos').insert(rows));cargar()}
function nuevoGrupo(){const n=(prompt('Nombre del grupo:')||'').trim();if(n)addGrupos([n])}
async function renGrupo(id){const g=G(id),n=(prompt('Nuevo nombre para «'+g.nombre+'» (máx. 30 caracteres):',g.nombre)||'').trim();if(!n||n==g.nombre)return;if(n.length>30)return toast('Máximo 30 caracteres',1);if(D().grupos.some(x=>x.nombre==n))return toast('Ya existe un grupo con ese nombre',1);
 await q(sb.from('gim2_grupos').update({nombre:n}).eq('id',id));const h={...(CF().horario||{})};Object.keys(h).forEach(k=>{if(h[k].group==g.nombre)h[k]={...h[k],group:n}});await cfg({horario:h});
 await q(sb.from('gim2_incidencias').update({grupo:n}).eq('curso_id',D().curso.id).eq('grupo',g.nombre));toast('Grupo renombrado: horario e incidencias actualizados');cargar()}
async function delGrupo(id){if(D().alumnos.some(a=>a.grupo_id==id))return toast('El grupo tiene alumnado: no se puede eliminar',1);if(!confirm('¿Eliminar '+G(id).nombre+'?'))return;await q(sb.from('gim2_grupos').delete().eq('id',id));cargar()}

const crearComp=i=>crearEnlace(COMPIS()[i],$('#ec').value||D().curso.fecha_fin);
function baja(id){const a=D().alumnos.find(x=>x.id==id);if(confirm('¿Dar de baja a '+a.nombre+'? Sale del listado pero se conserva su historial y podrás reactivarlo.'))updAl(id,{activo:false})}
async function addProf(){const n=$('#pn').value.trim();if(!n)return;await cfg({profesores:[...COMPIS(),n]});render()}
async function delProf(i){if(!confirm('¿Quitar a '+COMPIS()[i]+'? Sus enlaces no se revocan.'))return;await cfg({profesores:COMPIS().filter((_,k)=>k!=i)});render()}
// --- vistas ---
const irGrupo=n=>{const g=D().grupos.find(x=>x.nombre==n);if(g){S.g=g.id;S.tab='grupos';S.ed=false;render();scrollTo(0,0)}};
const fichaCodigo=c=>{const i=D().instrumentos.find(x=>x.codigo==c);if(i)fichaInst(i.id)};
const chipInst=(a,k)=>{const c=cod(a,k),i=D().instrumentos.find(x=>x.codigo==c);return c?`<button class="k2 ${i&&abierta(i.id)?(grav(abierta(i.id))=='rotura'?'inc':'det'):''}" onclick="fichaCodigo('${esc(c)}')">${esc(c)}</button>`:'<span class="mu">—</span>'};
const celdaAsig=(a,t)=>t.key=='X'&&a.modalidad=='flauta'?'<span class="pill">Flauta propia</span>':`<select onchange="asig('${a.id}','${t.key}',this.value)"><option value="">—</option>${opt(D().instrumentos.filter(i=>i.tipo==t.key&&(i.codigo==cod(a,t.key)||!i.retirado&&!usados(a,t.key).has(i.codigo))).map(i=>[i.codigo,i.codigo]),cod(a,t.key))}</select>`;
const filaAl=(a,ed)=>ed?`<tr class="${a.activo?'':'off'}"><td>${a.numero}</td><td>${esc(a.nombre)}</td><td><select onchange="updAl('${a.id}',{modalidad:this.value})">${opt([['xilofono','Xilófono'],['flauta','Flauta']],a.modalidad)}</select></td>${D().tipos.map(t=>`<td>${celdaAsig(a,t)}</td>`).join('')}<td>${a.activo?`<button class="b s" onclick="baja('${a.id}')">Dar de baja</button>`:`<span class="pill">De baja</span> <button class="b s" onclick="updAl('${a.id}',{activo:true})">Reactivar</button>${T?'':` <button class="b r" onclick="delAl('${a.id}')">Eliminar</button>`}`}</td></tr>`
 :`<tr><td>${a.numero}</td><td>${esc(a.nombre)}</td><td>${a.modalidad=='flauta'?'Flauta':'Xilófono'}</td>${D().tipos.map(t=>`<td>${t.key=='X'&&a.modalidad=='flauta'?'<span class="pill">Flauta propia</span>':chipInst(a,t.key)}</td>`).join('')}</tr>`;
const profsGrupo=n=>[...new Set(Object.values(CF().horario||{}).filter(s=>s.group==n&&s.teacher).map(s=>profEn(s.teacher,hoyISO())))];
const chipG=(x,mia)=>{const p=groupPalette(x.nombre),ps=profsGrupo(x.nombre);return `<button class="gc ${x.id==S.g?'on':''} ${mia?'mine':''}" style="--ga:${p.accent}" onclick="S.g='${x.id}';render()"><b>${esc(x.nombre)}</b> <small class="mu">${D().alumnos.filter(a=>a.grupo_id==x.id&&a.activo).length}</small>${ps.length?`<br><small class="gp">${mia?'✏️ ':''}${esc(ps.join(' · '))}</small>`:''}</button>`};
const grpChips=()=>{const m=T?misGrupos():new Set(),g=D().grupos,mias=g.filter(x=>m.has(x.nombre)),otras=g.filter(x=>!m.has(x.nombre));
 return T&&mias.length?`<p class="mu" style="margin:0 0 6px;font-size:13px">✏️ Tus grupos (puedes editarlos)</p><div class="gs">${mias.map(x=>chipG(x,1)).join('')}</div><p class="mu" style="margin:-4px 0 6px;font-size:13px">Resto de grupos · solo lectura</p><div class="gs">${otras.map(x=>chipG(x,0)).join('')}</div>`:`<div class="gs">${g.map(x=>chipG(x,0)).join('')}</div>`};
const alumnadoEd=()=>{if(!G(S.g))return '<p class="mu">Crea primero algún grupo.</p>';if(T&&!misGrupos().has(G(S.g).nombre))return `${grpChips()}<p class="mu">Solo puedes editar los grupos donde figuras en el horario.</p>`;const al=D().alumnos.filter(a=>a.grupo_id==S.g),nx=Math.max(0,...al.map(a=>a.numero))+1;
 return `${grpChips()}<div class="row"><input id="al" type="number" value="${nx}" style="width:72px"><input id="an" placeholder="Apellidos, Nombre" style="flex:1"><select id="am">${opt([['xilofono','Xilófono'],['flauta','Flauta']])}</select><button class="b" onclick="addAl()">Añadir alumno/a</button>${T?'':'<button class="b s" onclick="pegar()">Pegar lista</button><button class="b s" onclick="actualizarLista()" title="Renumera, añade y da de baja según la lista oficial">Actualizar con la lista oficial</button>'}</div>
 <div class="tw"><table><tr><th>Nº</th><th>Alumno/a</th><th>Modalidad</th>${D().tipos.map(t=>`<th>${esc(t.name)}</th>`).join('')}<th>Estado</th></tr>${al.slice().sort((a,b)=>(+b.activo)-(+a.activo)||a.numero-b.numero).map(a=>filaAl(a,true)).join('')}</table></div>`};
V.grupos=()=>{if(T&&S.ed)return `<div class="card"><div class="row"><b>Alumnado</b><button class="b s" onclick="S.ed=false;render()">✔ Terminar edición</button></div>${alumnadoEd()}</div>`;
 const g=G(S.g),al=D().alumnos.filter(a=>a.grupo_id==S.g&&a.activo);
 return `${grpChips()}`+(g?`<div class="card"><div class="row"><b>${esc(g.nombre)}</b><span class="mu">${al.length} alumnos/as</span><button class="b s" onclick="pdfGrupo()">PDF</button>${T?(misGrupos().has(g.nombre)?'<button class="b s" onclick="S.ed=true;render()">✏️ Editar alumnado</button>':'<span class="pill">Solo lectura · no es tu grupo</span>'):''}</div>
 <div class="tw"><table><tr><th>Nº</th><th>Alumno/a</th><th>Modalidad</th>${D().tipos.map(t=>`<th>${esc(t.name)}</th>`).join('')}</tr>${al.map(a=>filaAl(a,false)).join('')}</table></div></div>`:'<div class="card mu">No hay grupos: créalos en Administración.</div>')};
V.inventario=function(){const d=D();return `<div class="card"><div class="row"><b>Inventario</b><button class="b s" onclick="pdfInv()">PDF</button><button class="b r" onclick="nuevaInc()">Reportar incidencia</button></div><p class="mu" style="margin:0 0 8px">Verde: en buen estado · Gris: sin revisar · Amarillo: deterioro (se puede tocar) · Rojo: rotura / fuera de uso</p>${d.tipos.map(t=>`<h3>${esc(t.name)}</h3><div class="gr">${d.instrumentos.filter(i=>i.tipo==t.key).map(i=>`<button class="k ${estI(i)}" onclick="fichaInst('${i.id}')"><strong>${esc(i.codigo)}</strong><small>${d.alumnos.filter(a=>a.activo&&Object.values(a.asignaciones||{}).includes(i.codigo)).length} usuarios</small></button>`).join('')||'<span class="mu">Sin instrumentos (créalos en Administración)</span>'}</div>`).join('')}</div>`};
const horarioHtml=ed=>{const h=CF().horario||{},sel=(dw,k,f,v,lst,ph)=>`<select onchange="setSlot(${dw},${k},'${f}',this.value)"><option value="">${ph}</option>${opt(lst.map(x=>[x,x]),v)}</select>`,
 cel=(dw,k)=>{const s=h[dw+'-'+k]||{},cls=s.group?'hz-g':s.teacher?'hz-o':'hz-e';return `<td class="${cls}" style="${s.group?'--ga:'+groupPalette(s.group).accent:''}">${ed?sel(dw,k,'group',s.group,D().grupos.map(g=>g.nombre),'—')+sel(dw,k,'teacher',s.teacher,PROFS(),'Profesor/a'):s.group?`<b class="lnk" onclick="irGrupo('${esc(s.group)}')">${esc(s.group)}</b><br><small>${esc(s.teacher||'')}${subEn(s.teacher,hoyISO())?' · sust.: '+esc(subEn(s.teacher,hoyISO()).sustituto):''}</small>`:s.teacher?`<small>${esc(s.teacher)}</small><br><small class="mu">Optativa · sin instrumentos</small>`:''}</td>`};
 return `<div class="tw"><table class="hz"><tr><th></th>${DAYS.map(x=>`<th>${x}</th>`).join('')}</tr>${PERIODS.map((p,k)=>`${k==3?'<tr><th>Recreo<br><small>11:15–11:45</small></th><td colspan="5" class="hz-r">☕ Recreo</td></tr>':''}<tr><th>${p[0]}<br><small>${p[1]}–${p[2]}</small></th>${DAYS.map((_,dw)=>cel(dw,k)).join('')}</tr>`).join('')}</table></div><div class="hz-leg"><span class="hz-g" style="--ga:var(--ac)">Clase de música</span><span class="hz-o">Profesor/a en otra actividad (optativa)</span><span class="hz-e">Sin profesor/a</span><span class="hz-r">Recreo</span></div>`};
V.horario=()=>`<div class="card"><div class="row"><b>Horario semanal del aula</b><button class="b s" onclick="pdfHorario()">PDF</button></div>${T&&!D().config?'<p class="mu">El horario no está disponible todavía. Avisa al jefe de departamento.</p>':''}${horarioHtml(false)}</div>`;
const sec=(id,t,h)=>`<details class="card" ${S.op[id]?'open':''} ontoggle="S.op.${id}=this.open"><summary><b>${t}</b></summary>${h}</details>`;
V.admin=()=>{const c=D().curso;return sec('curso','Curso lectivo',`<p class="mu">Inicio y fin del curso (ej. septiembre–junio) delimitan el rastreo de usos y la caducidad por defecto de los enlaces. La <b>revisión inicial</b> es el día en que revisas todos los instrumentos al empezar el curso: el rastreo de un desperfecto parte de la última revisión buena y, si no hay, de esta fecha.</p>${c.revision_inicial?'':'<p style="color:var(--wn);font-weight:600">⚠ Falta la fecha de revisión inicial: sin ella el rastreo no tiene punto de partida para los instrumentos sin otra revisión.</p>'}<div class="row"><label>Inicio <input id="f1" type="date" value="${c.fecha_inicio||''}"></label><label>Fin <input id="f2" type="date" value="${c.fecha_fin||''}"></label><label>Revisión inicial <input id="f3" type="date" value="${c.revision_inicial||''}"></label><button class="b" onclick="fechas()">Guardar</button></div><button class="b s" onclick="nuevoCurso()">+ Nuevo curso lectivo</button>`)
 +sec('grupos','Grupos',`<div class="row">${D().grupos.map(g=>{const p=groupPalette(g.nombre);return `<span class="gc" style="--ga:${p.accent};cursor:default">${esc(g.nombre)} <a style="cursor:pointer" title="Renombrar" onclick="renGrupo('${g.id}')">✎</a> <a style="cursor:pointer" title="Eliminar" onclick="delGrupo('${g.id}')">✕</a></span>`}).join('')||'<span class="mu">Sin grupos</span>'}</div><div class="row"><button class="b s" onclick="nuevoGrupo()">+ Grupo</button><button class="b s" onclick="addGrupos(GRUPOS_DEF,1)">Añadir los habituales (2º–3º A–F, 4ºESO)</button></div>`)
 +sec('alumnado','Alumnado e instrumentos',alumnadoEd())+sec('horario','Horario semanal',horarioHtml(true))+sec('calendario','Calendario',calHtml())
 +sec('inv','Inventario',`<p class="mu">Indica cuántos instrumentos operativos hay de cada tipo: se crean los que falten y se retiran los sobrantes que no tengan usuarios ni incidencia abierta. Un instrumento retirado se puede reactivar desde su ficha.</p><div class="row">${D().tipos.map(t=>`<label>${esc(t.name)} <input id="n${t.key}" type="number" min="0" max="99" value="${D().instrumentos.filter(i=>i.tipo==t.key).length||32}" style="width:80px"></label>`).join('')}<button class="b" onclick="generar()">Ajustar inventario</button></div>`)
 +sec('copias','Copias',`<div class="row"><button class="b s" onclick="exportar()">Exportar copia (.json)</button><button class="b s" onclick="cartelQR()">Cartel con QR (PDF)</button><label class="b s">Importar copia<input type="file" accept=".json" hidden onchange="importar(this.files[0])"></label></div>`)};


// ===== Gravedad, sustituciones y permisos por grupo =====
const GRAV={deterioro:['Pintadas o escritura','Suciedad o pegatinas','Arañazo o golpe leve','Otro deterioro'],rotura:['Cuerda/pitón','Lámina/barra','Mástil/cuerpo','Maza/accesorio','No funciona','Otra rotura']},TRC={'trace-1':'#f2a199','trace-2':'#f8c4be','trace-3':'#fbcf9a','trace-4':'#fcdcb6','trace-5':'#fcf0a6','trace-6':'#e4e4e4'};
const grav=n=>n.gravedad||'deterioro',hoyISO=()=>new Date().toISOString().slice(0,10),subs=()=>CF().sustituciones||[],subEn=(n,f)=>subs().find(x=>x.titular==n&&x.desde<=f&&(!x.hasta||f<=x.hasta)),profEn=(n,f)=>subEn(n,f)?.sustituto||n,profLbl=(n,f)=>{const s=n&&subEn(n,f);return s?`${n} (sust.: ${s.sustituto})`:n};
const estI=i=>{if(i.retirado)return 'ret';const n=abierta(i.id);return n?(grav(n)=='rotura'?'inc':'det'):i.revision?'rev':'ok'};
const usados=(a,k)=>new Set(D().alumnos.filter(x=>x.grupo_id==a.grupo_id&&x.activo&&x.id!=a.id).map(x=>cod(x,k)));
const misGrupos=()=>{const ns=[D().profesor,D().sustituye].filter(Boolean);return new Set(Object.values(CF().horario||{}).filter(s=>s.group&&ns.includes(s.teacher)).map(s=>s.group))};
const tiposCon=(g,cur)=>{const l=GRAV[g].slice();if(cur&&!l.includes(cur))l.unshift(cur);return l.map(x=>[x,x])};
function tiposGrav(){$('#it').innerHTML=opt(tiposCon($('#igv').value,''),'')}
function nuevaInc(id){const s=slotNow(),ins=D().instrumentos.find(i=>i.id==id),kg=(ins&&(CF().knownGood||{})[ins.codigo])||D().curso.revision_inicial||'',pr=[...new Set([...PROFS(),...subs().filter(x=>!x.hasta).map(x=>x.sustituto)])];
 modal(`<h3>Registrar desperfecto</h3><div class="row"><select id="ii" onchange="kgAuto()">${opt(D().instrumentos.filter(i=>!i.retirado&&permitido(i)).map(i=>[i.id,i.codigo]),id)}</select><label>Detección <input id="idt" type="datetime-local" value="${isoL(new Date())}"></label><label>Última revisión OK <input id="ik" type="date" value="${kg}"></label></div>${kg?'':'<p style="color:var(--wn);margin:0 0 8px">⚠ No consta fecha de última revisión: el rastreo no tendrá punto de partida.</p>'}
 <div class="row"><select id="ig">${opt(D().grupos.map(g=>[g.nombre,g.nombre]),s.group||G(S.g)?.nombre)}</select><select id="ip"><option value="">Profesor/a…</option>${opt(pr.map(x=>[x,x]),profEn(s.teacher,hoyISO())||(T?D().profesor:''))}</select><input id="ir" placeholder="Alumno/a que lo notifica"></div>
 <div class="row"><select id="igv" onchange="tiposGrav()">${opt([['deterioro','🟡 Deterioro · se puede seguir tocando'],['rotura','🔴 Rotura / fuera de uso']],'deterioro')}</select><select id="it">${opt(tiposCon('deterioro',''),'')}</select></div>
 <textarea id="id" rows="3" placeholder="Describe el desperfecto"></textarea><textarea id="ia" rows="2" placeholder="Actuación inicial (opcional)"></textarea><p class="mu">Se guardan los alumnos que tenían el instrumento. Solo puede haber una incidencia abierta por instrumento.</p><div class="row"><button class="b" onclick="guardarInc()">Guardar</button><button class="b s" onclick="cerrar()">Cancelar</button></div>`)}
async function guardarInc(){const iid=$('#ii').value,ins=D().instrumentos.find(i=>i.id==iid),d=$('#id').value.trim(),grupo=$('#ig').value,tipo=$('#it').value,gv=$('#igv').value,kg=$('#ik').value,ex={detectedAt:$('#idt').value,teacher:$('#ip').value,studentReporter:$('#ir').value.trim(),knownGood:kg,action:$('#ia').value.trim()};if(!d)return toast('Describe la incidencia',1);

const clave=s=>norm(s).split(/[\s,]+/).filter(Boolean).sort().join(' ');
const leeLista=txt=>txt.split('\n').map(l=>l.trim().match(/^(\d{1,3})\s*[;\t]?\s*([A-Za-zÀ-ÖØ-öø-ÿ][^\d\/]*)$/)).filter(Boolean).map(m=>({numero:+m[1],nombre:m[2].trim()}));

function actualizarLista(){modal(`<h3>Actualizar ${esc(G(S.g).nombre)} con la lista oficial</h3><p class="mu">Pega la lista nueva tal cual sale del GICWeb («1 APELLIDOS, NOMBRE»). Verás un resumen antes de guardar nada. Los alumnos se reconocen por el nombre: conservan su instrumento y su historial aunque cambien de número.</p><textarea id="bk" rows="10"></textarea><div class="row"><button class="b" onclick="revisaLista()">Revisar cambios</button><button class="b s" onclick="cerrar()">Cancelar</button></div>`)}
function revisaLista(){const rows=leeLista($('#bk').value);if(!rows.length)return toast('No he reconocido ningún alumno. Pega la lista con el formato «nº APELLIDOS, NOMBRE».',1);
 const nums=rows.map(r=>r.numero),keys=rows.map(r=>clave(r.nombre));if(new Set(nums).size<nums.length)return toast('En la lista se repite algún número.',1);if(new Set(keys).size<keys.length)return toast('En la lista hay dos alumnos con el mismo nombre.',1);
 const ex=D().alumnos.filter(a=>a.grupo_id==S.g),por=new Map();ex.forEach(a=>{const k=clave(a.nombre);if(!por.has(k)||a.activo)por.set(k,a)});
 const reno=[],nuevos=[],react=[],igual=[],vistos=new Set();
 rows.forEach(r=>{const a=por.get(clave(r.nombre));if(!a){nuevos.push(r);return}vistos.add(a.id);if(!a.activo)react.push({a,numero:r.numero});else if(a.numero!=r.numero)reno.push({a,numero:r.numero});else igual.push(a)});
 const faltan=ex.filter(a=>a.activo&&!vistos.has(a.id));S.act={rows,reno,nuevos,react,igual,faltan,ex,vistos};
 if(!reno.length&&!nuevos.length&&!react.length&&!faltan.length)return modal(`<h3>Sin cambios</h3><p>La lista coincide con lo que ya hay en ${esc(G(S.g).nombre)} (${igual.length} alumnos/as).</p><div class="row"><button class="b s" onclick="cerrar()">Cerrar</button></div>`);
 modal(`<h3>Actualizar ${esc(G(S.g).nombre)}: revisa los cambios</h3><p class="mu">No se guarda nada hasta que pulses «Aplicar».</p>
 ${bloq('Cambian de número ('+reno.length+')',reno.map(x=>`${esc(x.a.nombre)}: ${x.a.numero} → <b>${x.numero}</b>`))}${bloq('Nuevos, sin instrumento ('+nuevos.length+')',nuevos.map(r=>`<b>${r.numero}</b> · ${esc(bonito(r.nombre))}`))}${bloq('Se reactivan ('+react.length+')',react.map(x=>`${esc(x.a.nombre)} → nº <b>${x.numero}</b>`))}
 ${faltan.length?`<h4 style="margin:10px 0 4px">Ya no aparecen en la lista (${faltan.length}) · se dan de baja si dejas la casilla marcada</h4>${faltan.map(a=>`<label class="ui" style="display:block"><input type="checkbox" class="bajaCk" data-id="${a.id}" checked> nº${a.numero} · ${esc(a.nombre)}</label>`).join('')}`:''}
 <p class="mu">Sin cambios: ${igual.length} alumnos/as.</p><div class="row"><button class="b" onclick="aplicaLista()">Aplicar cambios</button><button class="b s" onclick="cerrar()">Cancelar</button></div>`)}
async function aplicaLista(){const A=S.act;if(!A)return;const alta=new Set([...document.querySelectorAll('.bajaCk')].filter(c=>c.checked).map(c=>c.dataset.id)),
 obj=new Set(A.rows.map(r=>r.numero)),usados=new Set([...A.ex.map(a=>a.numero),...obj]),libre=()=>{let n=1;while(usados.has(n))n++;usados.add(n);return n},
 cambia=[...A.reno,...A.react].filter(x=>x.a.numero!=x.numero),estorban=A.ex.filter(a=>!A.vistos.has(a.id)&&obj.has(a.numero)),
 ocup=new Set(A.ex.filter(a=>a.activo&&!alta.has(a.id)).flatMap(a=>Object.values(a.asignaciones||{})));

  // 1) se liberan los números que hacen falta (provisional para quien cambia; definitivo para quien estorba y no está en la lista)
  await Promise.all([...cambia.map(x=>x.a.id),...estorban.map(a=>a.id)].map(id=>q(sb.from('gim2_alumnos').update({numero:libre()}).eq('id',id))));
  // 2) número definitivo y reactivaciones (si su instrumento ya lo tiene otro del grupo, lo pierde)
  await Promise.all([...A.reno.map(x=>({a:x.a,numero:x.numero})),...A.react].map(x=>{const u={numero:x.numero};if(!x.a.activo){u.activo=true;const c=Object.values(x.a.asignaciones||{});if(c.some(k=>ocup.has(k)))u.asignaciones={};else c.forEach(k=>ocup.add(k))}return q(sb.from('gim2_alumnos').update(u).eq('id',x.a.id))}));

 }catch(e){toast('Se interrumpió a mitad. Vuelve a pulsar «Actualizar con la lista oficial» con la misma lista para terminar.',1);cargar();return}
 cerrar();S.act=null;toast(`Lista actualizada: ${A.reno.length+A.react.length} renumerados/reactivados · ${A.nuevos.length} nuevos · ${alta.size} bajas`);cargar()}
